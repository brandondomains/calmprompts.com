title: Calm Prompts
tagline: Reusable prompts in a calmer, cleaner workspace.
description: Browse a structured library of copy-ready prompt templates for writing, work, study, travel, and practical everyday tasks.
url: 'https://calmprompts.com'
baseurl: ''
markdown: kramdown
permalink: pretty
google_analytics: G-WS9FYF6T8N
collections:
  prompts:
    output: true
    permalink: /p/:slug/
  prompt_categories:
    output: true
    permalink: /c/:slug/
defaults:
- scope:
    path: assets
  values:
    layout: null
- scope:
    path: ''
    type: prompts
  values:
    layout: prompt
- scope:
    path: ''
    type: prompt_categories
  values:
    layout: category
- scope:
    path: ''
  values:
    layout: default
